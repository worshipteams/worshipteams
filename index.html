<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preload" href="dunggeunmiso-b.woff2" as="font" type="font/woff2" crossorigin>
<script>(function(){try{var t=localStorage.getItem("wt-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})()</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="찬양팀">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>찬양팀</title>
<style>
@font-face{font-family:"Dunggeunmiso";src:url("dunggeunmiso-b.woff2") format("woff2");font-weight:400 900;font-style:normal;font-display:swap}
/* ===== 라이트 ===== */
:root{
  --bg:#ffffff;--card:#ffffff;--ink:#1a1a1a;--sub:#6b6b66;--faint:#a8a8a2;--hair:#e7e7e2;
  --acc:#3fbb5c;--acc-ink:#111111;--acc-soft:#e3f4e2;--acc-text:#23893d;
  --p-beige:#f8f2e3;--p-blue:#e9f2fb;--p-pink:#fbebef;--p-green:#eef6e3;--p-yellow:#fdf5d6;
  --gold:#a0700a;--gold-soft:#fdf2cc;
  --ok:#23893d;--ok-soft:#e3f4e2;--no:#d9473a;--no-soft:#fde5e1;--warn:#d68a0c;
  --flame:#ffcf5c;
  --bw:1.5px;--r:16px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --display:"Dunggeunmiso","Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
/* ===== 다크 ===== */
:root[data-theme="dark"]{
  --bg:#111211;--card:#191a19;--ink:#ecece5;--sub:#a2a29a;--faint:#64645e;--hair:#2b2c2a;
  --acc:#57d071;--acc-ink:#0b130d;--acc-soft:#1d3322;--acc-text:#6fdd86;
  --p-beige:#29251a;--p-blue:#192430;--p-pink:#2d1d22;--p-green:#1c2a19;--p-yellow:#2b2816;
  --gold:#e9bb4f;--gold-soft:#302711;
  --ok:#6fdd86;--ok-soft:#1d3322;--no:#ff7a6d;--no-soft:#3a1c19;--warn:#f0a43c;
  --flame:#e9b23f;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111211;--card:#191a19;--ink:#ecece5;--sub:#a2a29a;--faint:#64645e;--hair:#2b2c2a;
  --acc:#57d071;--acc-ink:#0b130d;--acc-soft:#1d3322;--acc-text:#6fdd86;
  --p-beige:#29251a;--p-blue:#192430;--p-pink:#2d1d22;--p-green:#1c2a19;--p-yellow:#2b2816;
  --gold:#e9bb4f;--gold-soft:#302711;
  --ok:#6fdd86;--ok-soft:#1d3322;--no:#ff7a6d;--no-soft:#3a1c19;--warn:#f0a43c;
  --flame:#e9b23f;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.35;cursor:default}
input,textarea,select{width:100%;border:var(--bw) solid var(--hair);background:var(--card);border-radius:12px;padding:12px 13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{resize:vertical;min-height:88px;line-height:1.6}
a{color:var(--ink)}
a.btn{text-decoration:none}
.disp,.grp .title,.auth-hero h1,.card h3,.sec-t,.sheet h3,.tile .tl,.sum b,.statbar b,.wd .wc b,.day-t b,.sw .time,.sl .t,.sl .date b,.banner .t,.cal-h b,.cal-sun b,.empty b,.q .qn,.top-song .rk,.av,.inv b,.big-t{font-family:var(--display);font-weight:400;letter-spacing:0;-webkit-font-smoothing:antialiased}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
/* 상단 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:flex-end;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:var(--bg)}
.grp{display:flex;flex-direction:column;align-items:flex-start;text-align:left;max-width:72%;min-width:0}
.grp small{font-size:12.5px;font-weight:700;color:var(--sub)}
.grp span{display:flex;align-items:center;gap:7px;max-width:100%}
.grp .title{font-size:28px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .caret{font-style:normal;flex:none;width:22px;height:22px;border:var(--bw) solid var(--ink);border-radius:6px;display:grid;place-items:center;font-size:9px}
.top .sp{flex:1}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--sub);border:var(--bw) solid var(--hair);background:var(--card)}
.icon-btn svg{width:19px;height:19px}
.icon-btn i{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--acc-ink);border:var(--bw) solid var(--ink);font-size:10.5px;font-style:normal;font-weight:800;display:grid;place-items:center;padding:0 4px}
main{padding:4px 18px 20px}
/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--bg);border-top:var(--bw) solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{display:flex;width:100%;max-width:760px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:10.5px;color:var(--faint);font-weight:700}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{stroke-width:2.4}
/* 카드 */
.card{background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:17.5px;font-weight:800}
.sec-t{margin:22px 2px 10px;font-size:16px;color:var(--ink);font-weight:800;display:flex;align-items:center;gap:6px}
.muted{color:var(--sub)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.sp{flex:1}
/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 20px;border-radius:13px;background:var(--acc);color:var(--acc-ink);border:var(--bw) solid var(--ink);font-weight:800;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--p-green);color:var(--ink)}
.btn.line{background:var(--card);color:var(--ink)}
.btn.danger{background:var(--no-soft);color:var(--no);border-color:var(--no)}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.sq{width:34px;height:34px;border-radius:9px;border:var(--bw) solid var(--hair);display:grid;place-items:center;color:var(--sub);font-size:17px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 13px;border-radius:17px;border:var(--bw) solid var(--ink);background:var(--card);font-size:13px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.warn{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.chip.on.warn{background:var(--warn);color:#fff}
.chip.add{border-style:dashed;border-color:var(--sub);color:var(--sub)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:800;border:1px solid var(--ink);background:var(--p-green);color:var(--ink);white-space:nowrap}
.tag.gold{background:var(--p-yellow)}
.tag.ok{background:var(--acc);color:var(--acc-ink)}
.tag.no{background:var(--no-soft);color:var(--no);border-color:var(--no)}
.tag.gray{background:var(--card);color:var(--sub);border-color:var(--hair)}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:800;color:var(--ink);margin:0 2px 7px}
.empty{text-align:center;padding:40px 16px;color:var(--sub);border:var(--bw) dashed var(--hair);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.seg{display:flex;border:var(--bw) solid var(--ink);border-radius:13px;padding:3px;margin-bottom:14px;background:var(--card)}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:800;font-size:13.5px;color:var(--sub)}
.seg button.on{background:var(--ink);color:var(--bg)}
.skel{height:110px;border-radius:var(--r);border:var(--bw) solid var(--hair);background:linear-gradient(90deg,var(--card),var(--hair),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--sub);font-weight:800;margin:2px 0 10px;height:34px}
/* 로그인 */
.auth-hero{padding:calc(50px + env(safe-area-inset-top)) 24px 26px;max-width:440px;margin:0 auto}
.auth-hero h1{font-size:44px;margin:0 0 6px;line-height:1.1}
.auth-hero p{margin:0;color:var(--sub)}
.auth-deco{display:flex;gap:8px;margin-bottom:22px}
.auth-deco span{width:48px;height:48px;border-radius:50%;border:var(--bw) solid var(--ink);background:linear-gradient(to top,var(--acc) var(--f),var(--card) var(--f))}
.logo{display:none}
.auth{max-width:440px;margin:0 auto;padding:0 18px 40px}
/* 경건: 주간 동그라미 */
.wk-h{display:flex;align-items:center;gap:6px;margin:0 2px 10px}
.wk-h b{font-size:14px;color:var(--sub)}
.wstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:18px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px}
.wd .wl{font-size:11.5px;font-weight:700;color:var(--sub);height:16px}
.wd.today .wl{color:var(--ink);font-weight:900}
.wd .wc{width:46px;height:46px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;background:linear-gradient(to top,var(--acc) var(--f),var(--card) var(--f));transition:box-shadow .15s}
.wd .wc b{font-size:16px;font-weight:800;color:var(--ink)}
.wd.sel .wc{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--ink)}
.wd i{width:6px;height:6px;border-radius:3px;background:transparent}
.wd i.on{background:#4aa3df}
.day-t{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.day-t b{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border:var(--bw) solid var(--ink);border-radius:var(--r);overflow:hidden;margin-bottom:12px;background:var(--card)}
.tile{position:relative;min-height:176px;display:flex;flex-direction:column;align-items:center;padding:16px 6px 0;border-right:var(--bw) solid var(--ink);text-align:center}
.tile:last-child{border-right:0}
.tile .tl{font-size:16px;font-weight:800}
.tile .tv{margin-top:6px;font-size:13px;color:var(--sub);font-weight:700;min-height:34px;display:flex;align-items:center;justify-content:center;gap:4px}
.tile .tv input{width:40px;padding:4px 2px;text-align:center;font-weight:800;border-radius:8px;font-size:15px}
.tile .tv .mini{width:26px;height:26px;border-radius:8px;border:var(--bw) solid var(--ink);font-weight:800;font-size:15px;line-height:1;background:var(--card)}
.tile .ti{margin-top:auto;position:relative;width:74px;height:62px;display:flex;align-items:flex-end;justify-content:center;color:var(--ink)}
.tile .ti svg{width:74px;height:56px}
.ck{position:absolute;left:50%;top:-14px;margin-left:-16px;width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;transform:rotate(-9deg);box-shadow:0 0 0 2px var(--card)}
.ck svg{width:20px!important;height:20px!important}
.p-beige{background:var(--p-beige)}.p-blue{background:var(--p-blue)}.p-pink{background:var(--p-pink)}.p-green{background:var(--p-green)}.p-yellow{background:var(--p-yellow)}
.sw{text-align:center;padding:18px 16px}
.sw .lbl{font-size:13px;color:var(--sub);font-weight:800}
.sw .time{font-size:50px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 12px;line-height:1.15}
.sw.run{background:var(--p-yellow)}
.sw.run .time{color:var(--ink)}
.sw .btns{display:flex;gap:8px;justify-content:center}
.sw .btns .btn{min-width:112px}
.wk{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 10px}
.wk b{font-size:15px}
.wk button{width:34px;height:34px;border-radius:9px;color:var(--sub);font-size:18px;border:var(--bw) solid var(--hair)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border:var(--bw) solid var(--ink);border-radius:var(--r);overflow:hidden;text-align:center;margin-bottom:12px}
.sum div{padding:13px 4px;border-right:var(--bw) solid var(--ink);background:var(--card)}
.sum div:last-child{border-right:0}
.sum b{display:block;font-size:19px;font-weight:900}.sum span{font-size:12px;color:var(--sub);font-weight:700}
.tt{width:100%;border-collapse:collapse;font-size:13.5px}
.tt th{font-size:11.5px;color:var(--sub);font-weight:800;text-align:center;padding:6px 4px;white-space:nowrap}
.tt td{padding:10px 4px;border-top:1px solid var(--hair);text-align:center;white-space:nowrap}
.tt td:first-child,.tt th:first-child{text-align:left}
.tt tr.click{cursor:pointer}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:5px;border:1px solid var(--ink);background:var(--card)}.dots i.on{background:var(--acc)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 송리스트 */
.sl{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.sl .date{flex:none;width:58px;text-align:center;background:var(--p-beige);border:var(--bw) solid var(--ink);border-radius:12px;padding:7px 0}
.sl .date b{display:block;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15}.sl .date span{font-size:11px;font-weight:700;color:var(--sub)}
.sl .t{font-size:17px}.sl .songs{font-size:13px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yt{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px;border:var(--bw) solid var(--ink)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.songtbl{width:100%;border-collapse:collapse;font-size:14px}
.songtbl th{font-size:11.5px;color:var(--sub);text-align:left;padding:4px 6px;font-weight:800}
.songtbl td{padding:10px 6px;border-top:1px solid var(--hair);vertical-align:top}
.songtbl .n{width:26px;font-weight:900}
.songtbl .k{white-space:nowrap;font-weight:800;color:var(--acc-text)}
.songtbl .b{white-space:nowrap;color:var(--sub)}
.pre{white-space:pre-wrap;word-break:break-word}
.q{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--hair)}
.q:first-of-type{border-top:0}
.q .qn{flex:none;width:30px;height:30px;border-radius:9px;background:var(--p-yellow);border:var(--bw) solid var(--ink);font-weight:900;display:grid;place-items:center;font-size:12.5px}
.cm{padding:12px 0;border-top:1px solid var(--hair)}
.cm .h{display:flex;align-items:center;gap:6px;font-size:13px}
.cm .h b{font-size:14px}
.cm .body{margin-top:3px}
.cm-in{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--card);border:var(--bw) solid var(--ink);border-radius:14px;padding:10px;margin-top:12px}
.cm-in textarea{min-height:44px;border:0;padding:6px 4px;background:transparent}
.ed-song{display:grid;grid-template-columns:22px 1fr 64px 58px 28px;gap:6px;align-items:center;margin-bottom:6px}
.ed-song input{padding:10px 9px;font-size:14px;border-radius:10px}
.ed-song .n{font-weight:900;text-align:center}
.ed-song .note{grid-column:2 / 5}
.ed-song .x{width:28px;height:28px;border-radius:8px;color:var(--faint);font-size:18px}
/* 검색 */
.search{position:relative;margin-bottom:14px}
.search input{padding-left:44px;height:52px;font-size:16px;border-radius:14px;border-color:var(--ink)}
.search svg{position:absolute;left:15px;top:16px;width:20px;height:20px;color:var(--ink)}
.hit{padding:11px 0;border-top:1px solid var(--hair);cursor:pointer}
.hit:first-of-type{border-top:0}
.top-song{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--hair);cursor:pointer}
.top-song:first-of-type{border-top:0}
.top-song .rk{width:26px;height:26px;border-radius:50%;border:var(--bw) solid var(--ink);font-weight:900;display:grid;place-items:center;font-size:12px}
.top-song:nth-child(-n+3) .rk{background:var(--acc);color:var(--acc-ink)}
/* 스케줄 */
.banner{background:var(--p-green);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:16px 16px 15px;margin-bottom:10px;position:relative;color:var(--ink)}
.banner .k{font-size:12px;font-weight:800;color:var(--sub)}
.banner .t{font-family:var(--display);font-weight:400;font-size:24px;margin:2px 0 4px;line-height:1.2}
.banner .w{font-size:13.5px;font-weight:600}
.banner .dd{position:absolute;top:14px;right:14px;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 9px;font-weight:800;font-size:12.5px;transform:rotate(-4deg)}
.banner.add{background:var(--card);border-style:dashed;border-color:var(--hair);color:var(--sub);text-align:center;font-weight:800}
.pr-more{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.pr-more button{flex:none;text-align:left;background:var(--card);border:var(--bw) solid var(--ink);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--sub)}
.pr-more b{display:block;font-size:13.5px;color:var(--ink)}
.cal-wrap{border:var(--bw) solid var(--ink);border-radius:var(--r);padding:12px 10px;background:var(--card)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.cal-h b{font-family:var(--display);font-weight:400;font-size:20px}
.cal-h button{width:34px;height:34px;border-radius:9px;color:var(--sub);font-size:18px;border:var(--bw) solid var(--hair)}
.cal{display:grid;grid-template-columns:1.9fr repeat(6,1fr);gap:4px}
.cal .dow{font-size:11.5px;text-align:center;color:var(--sub);font-weight:800;padding-bottom:3px}
.cal .dow:first-child{color:var(--ink)}
.cal-d{min-height:64px;padding:7px 0;text-align:center;font-size:12px;color:var(--faint)}
.cal-sun{min-height:64px;border-radius:12px;background:var(--card);border:var(--bw) solid var(--ink);padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.cal-sun b{font-size:15px;font-weight:900}
.cal-sun.past{opacity:.45}
.cal-sun.conf{background:var(--p-green)}
.cal-sun.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.cal-sun .cnt{font-size:10.5px;color:var(--sub);font-weight:700}
.cal-sun .tag{height:20px;font-size:10.5px;padding:0 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:12px 2px;align-items:center}
.av-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.av-btns button{height:58px;border-radius:14px;border:var(--bw) solid var(--ink);font-weight:800;font-size:16px;color:var(--ink);background:var(--card)}
.av-btns .yes.on{background:var(--acc);color:var(--acc-ink)}
.av-btns .no.on{background:var(--no);border-color:var(--ink);color:#fff}
.roster{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;align-items:start}
.roster .p{font-weight:800;font-size:13px;color:var(--sub);padding-top:6px}
.roster .me{background:var(--acc);color:var(--acc-ink)}
.statbar{display:grid;grid-template-columns:repeat(4,1fr);border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;margin-bottom:12px}
.statbar div{padding:9px 4px;text-align:center;border-right:var(--bw) solid var(--ink)}
.statbar div:last-child{border-right:0}
.statbar b{display:block;font-size:19px;font-weight:900}
.statbar .ok{background:var(--p-green)}.statbar .no{background:var(--p-pink)}.statbar .no b{color:var(--no)}
.asg-row{padding:11px 0;border-top:1px solid var(--hair)}
.asg-row .h{display:flex;justify-content:space-between;font-weight:800;font-size:13.5px;margin-bottom:8px}
.mtx th,.mtx td{padding:8px 5px;font-size:12.5px}
.mtx .o{color:var(--ok);font-weight:900}.mtx .x{color:var(--no);font-weight:900}.mtx .a{color:var(--acc-ink);background:var(--acc);border:1px solid var(--ink);border-radius:6px;padding:1px 5px;font-weight:800;font-size:11.5px}
/* 팀 */
.mem{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--hair)}
.mem:first-of-type{border-top:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--p-green);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-weight:900}
.mem .nm{font-weight:800}
.mem .ps{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.inv{display:flex;align-items:center;gap:10px;background:var(--p-yellow);border:var(--bw) solid var(--ink);border-radius:14px;padding:12px;margin-bottom:8px}
/* 시트 */
#sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;max-height:90vh;overflow-y:auto;background:var(--card);border:var(--bw) solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sheet-wrap.open .sheet-bg{opacity:1}
#sheet-wrap.open .sheet{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--hair);margin:4px auto 14px}
.sheet h3{margin:0 0 14px;font-size:21px;font-weight:900}
@media (min-width:700px){.sheet{bottom:auto;top:50%;border-bottom:var(--bw) solid var(--ink);border-radius:22px;transform:translateY(-40%);opacity:0;transition:all .2s}#sheet-wrap.open .sheet{transform:translateY(-50%);opacity:1}.sheet .grab{display:none}}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--no);color:#fff}
.offline{background:var(--warn);color:#fff;text-align:center;font-size:12.5px;font-weight:800;padding:5px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-wrap" hidden><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="supabase.js"></script>
<script>
'use strict';
/* ================= 설정 ================= */
const SB_URL = 'https://mohlaubqhmdkdbarboxm.supabase.co';
const SB_KEY = 'sb_publishable_M7kYivBsBMSTN1iR41toqw_C9NTrx1-';
const EMAIL_DOMAIN = 'users.worshipteam.app';
const VERSION = '베타 0.1';
const POS = ['워십리더','사역자','보컬','건반','일렉','베이스','드럼','음향'];
const SERVE_POS = ['워십리더','보컬','건반','일렉','베이스','드럼','음향'];
const LEAD = ['워십리더','사역자'];
const DOW = '일월화수목금토';

const sb = supabase.createClient(SB_URL, SB_KEY, {
  auth: { storageKey: 'worship-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  realtime: { params: { eventsPerSecond: 5 } }
});

const S = {
  user: null, me: null, groups: [], invites: [], gid: null, members: [], memberMap: {},
  tab: localStorage.getItem('wt-tab') || 'devo',
  devo: {}, devoWeek: null, devoMode: 'me',
  slView: null, slEdit: null, slLimit: 20, slFilter: 0,
  q: '', schMonth: null, sch: null, asg: null,
  chans: [], timers: [], seq: 0
};

/* ================= 도우미 ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay()+6)%7)); };
const todayStr = () => ymd(new Date());
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const longDate = s => { const d = parse(s); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };
const fullDate = s => { const d = parse(s); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; };
const nextSunday = () => { const d = new Date(); d.setHours(0,0,0,0); return ymd(addDays(d, (7 - d.getDay()) % 7)); };
const clock = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return `${h}:${pad(m)}:${pad(s)}`; };
const shortDur = sec => { sec = Math.floor(sec||0); if (!sec) return '0분'; const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60); return h ? `${h}시간${m ? ' '+m+'분' : ''}` : (m ? `${m}분` : `${sec}초`); };
const prayCell = sec => { sec = Math.floor(sec||0); if (!sec) return '—'; const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60); return h ? `${h}시간 ${m}분` : `${m}분 ${pad(sec%60)}초`; };
const timeK = d => { let h = d.getHours(); const m = d.getMinutes(); const ap = h < 12 ? '오전' : '오후'; h = h % 12 || 12; return `${ap} ${h}:${pad(m)}`; };
const uid = () => S.user?.id;
const initial = n => (n || '?').trim().slice(0, 1);
const posOrder = p => { const i = POS.indexOf(p); return i < 0 ? 99 : i; };
const sortPos = arr => [...(arr||[])].sort((a,b) => posOrder(a) - posOrder(b));

function toast(msg, type) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (type || '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 2600);
}
function errMsg(e) {
  const m = e?.message || e?.error || String(e);
  if (/Invalid login/i.test(m)) return '아이디 또는 비밀번호가 맞지 않습니다';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return '인터넷 연결을 확인해 주세요';
  if (/JWT|refresh token/i.test(m)) return '로그인이 만료되었습니다. 다시 로그인해 주세요';
  if (/duplicate key/i.test(m)) return '이미 같은 내용이 있습니다';
  if (/violates check constraint/i.test(m)) return '입력한 값을 확인해 주세요';
  if (/row-level security|permission denied/i.test(m)) return '권한이 없습니다';
  return m;
}
const fail = e => { console.error(e); toast(errMsg(e), 'err'); };
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
async function busy(el, fn) {
  if (el?.dataset.busy) return; if (el) { el.dataset.busy = 1; el.disabled = true; }
  try { await fn(); } catch (e) { fail(e); }
  finally { if (el) { delete el.dataset.busy; el.disabled = false; } }
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* 시트(아래에서 올라오는 창) */
function openSheet(html) {
  const w = $('#sheet-wrap'); $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  w.hidden = false; requestAnimationFrame(() => w.classList.add('open'));
}
function closeSheet() {
  const w = $('#sheet-wrap'); w.classList.remove('open'); S.asg = null;
  setTimeout(() => { if (!w.classList.contains('open')) { w.hidden = true; $('#sheet').innerHTML = ''; } }, 220);
}

/* 이벤트 위임 */
const A = {}, I = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && I[el.dataset.in]) I[el.dataset.in](el, e); });
A.closeSheet = closeSheet;

/* 아이콘 */
const ic = {
  devo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M12 7v6M9 10h6"/></svg>',
  songs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  sched: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M7 14h2"/></svg>',
  team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 20a6.5 6.5 0 0 0-3-5.5"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.8 6.8 0 0 0 11 11z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>'
};
const TABS = [
  { id: 'devo', label: '경건', icon: ic.devo },
  { id: 'songs', label: '송리스트', icon: ic.songs },
  { id: 'search', label: '곡 검색', icon: ic.search },
  { id: 'sched', label: '스케줄', icon: ic.sched },
  { id: 'team', label: '팀', icon: ic.team }
];

/* ================= 권한 ================= */
const curGroup = () => S.groups.find(g => g.id === S.gid);
const myMember = () => S.members.find(m => m.user_id === uid() && m.status === 'active');
const isLeader = () => !!myMember()?.positions?.some(p => LEAD.includes(p));
const canManage = () => isLeader() || curGroup()?.owner_id === uid();
const activeMembers = () => S.members.filter(m => m.status === 'active')
  .sort((a,b) => posOrder(sortPos(a.positions)[0]) - posOrder(sortPos(b.positions)[0]) || a.name.localeCompare(b.name, 'ko'));
const nameOf = id => S.memberMap[id]?.name || (id === uid() ? S.me?.display_name : '(나간 팀원)');

/* ================= 로그인 ================= */
const emailOf = u => `${u.trim().toLowerCase()}@${EMAIL_DOMAIN}`;
function showAuth(mode = 'login') {
  stopLive();
  $('#app').innerHTML = `
  <div class="auth-hero"><div class="auth-deco"><span style="--f:100%"></span><span style="--f:66%"></span><span style="--f:33%"></span><span style="--f:0%"></span></div><h1>찬양팀</h1><p>경건 체크부터 송리스트, 섬김 스케줄까지 한곳에서</p></div>
  <div class="auth"><div class="card">
    <div class="seg"><button class="${mode==='login'?'on':''}" data-act="authMode" data-m="login">로그인</button><button class="${mode==='join'?'on':''}" data-act="authMode" data-m="join">회원가입</button></div>
    <form id="authf" autocomplete="on">
      <div class="field"><label>아이디</label><input id="au" autocapitalize="none" autocomplete="username" spellcheck="false" placeholder="영문 소문자·숫자·_ 3~20자" maxlength="20"></div>
      ${mode==='join' ? `<div class="field"><label>이름</label><input id="an" autocomplete="name" placeholder="팀에서 보일 이름" maxlength="20"></div>` : ''}
      <div class="field"><label>비밀번호</label><input id="ap" type="password" autocomplete="${mode==='join'?'new-password':'current-password'}" placeholder="6자 이상"></div>
      ${mode==='join' ? `<div class="field"><label>비밀번호 확인</label><input id="ap2" type="password" autocomplete="new-password"></div>` : ''}
      <button class="btn block" id="authgo" type="submit" style="margin-top:6px">${mode==='join' ? '가입하고 시작하기' : '로그인'}</button>
    </form></div>
    <p class="faint tiny" style="margin-top:18px;text-align:center">${VERSION} · 이메일 없이 아이디로 가입합니다. 비밀번호를 잊으면 다시 찾을 수 없으니 꼭 기억해 두세요.</p>
  </div>`;
  $('#authf').onsubmit = e => { e.preventDefault(); doAuth(mode); };
}
A.authMode = el => showAuth(el.dataset.m);
async function doAuth(mode) {
  const btn = $('#authgo');
  const u = $('#au').value.trim().toLowerCase(), p = $('#ap').value;
  if (!/^[a-z0-9_]{3,20}$/.test(u)) return toast('아이디는 영문 소문자·숫자·_ 3~20자입니다', 'err');
  if (p.length < 6) return toast('비밀번호는 6자 이상입니다', 'err');
  await busy(btn, async () => {
    if (mode === 'join') {
      const n = $('#an').value.trim();
      if (!n) throw new Error('이름을 적어 주세요');
      if (p !== $('#ap2').value) throw new Error('비밀번호 확인이 맞지 않습니다');
      const r = await fetch(`${SB_URL}/functions/v1/signup`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` },
        body: JSON.stringify({ username: u, password: p, display_name: n })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || '가입하지 못했습니다');
    }
    const { data, error } = await sb.auth.signInWithPassword({ email: emailOf(u), password: p });
    if (error) throw error;
    await afterLogin(data.user);
    if (mode === 'join') toast('가입을 환영합니다!');
  });
}

/* ================= 시작 ================= */
async function afterLogin(user) {
  S.user = user;
  try {
    S.me = await q(sb.from('profiles').select('id,username,display_name').eq('id', user.id).single());
  } catch (e) { fail(e); return showAuth(); }
  await loadGroups();
  renderShell();
  flushDevo();
}
async function loadGroups() {
  const rows = await q(sb.from('members')
    .select('group_id,status,positions,invited_by,groups(id,name,owner_id),inviter:profiles!members_invited_by_fkey(display_name)')
    .eq('user_id', uid()));
  S.groups = rows.filter(r => r.status === 'active' && r.groups).map(r => r.groups).sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  S.invites = rows.filter(r => r.status === 'invited' && r.groups).map(r => ({ group_id: r.group_id, name: r.groups.name, positions: r.positions, inviter: r.inviter?.display_name }));
  const saved = localStorage.getItem('wt-gid-' + uid());
  S.gid = S.groups.find(g => g.id === saved)?.id || S.groups[0]?.id || null;
  await loadMembers();
}
async function loadMembers() {
  S.members = []; S.memberMap = {};
  if (!S.gid) return;
  const rows = await q(sb.from('members')
    .select('user_id,positions,status,profile:profiles!members_user_id_fkey(username,display_name)')
    .eq('group_id', S.gid));
  S.members = rows.map(r => ({ user_id: r.user_id, positions: sortPos(r.positions), status: r.status, name: r.profile?.display_name || '?', username: r.profile?.username || '' }));
  S.members.forEach(m => S.memberMap[m.user_id] = m);
}

function stopLive() {
  S.chans.forEach(c => sb.removeChannel(c)); S.chans = [];
  S.timers.forEach(t => clearInterval(t)); S.timers = [];
}

function grpLabel() {
  const d = new Date();
  return `<small>${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일</small><span><b class="title">${esc(curGroup()?.name || '그룹 없음')}</b><em class="caret">▼</em></span>`;
}
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('wt-theme', t); } catch {}
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = isDark() ? '#111211' : '#ffffff';
}
A.themeToggle = el => { applyTheme(isDark() ? 'light' : 'dark'); el.innerHTML = isDark() ? ic.sun : ic.moon; };
A.themeSet = el => { applyTheme(el.dataset.t); renderShell(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => applyTheme(localStorage.getItem('wt-theme') || 'auto'));

function renderShell() {
  const g = curGroup();
  $('#app').innerHTML = `
  <div id="offline" class="offline" ${navigator.onLine ? 'hidden' : ''}>오프라인 상태입니다 · 연결되면 자동으로 저장됩니다</div>
  <header class="top">
    <button class="grp" data-act="groupMenu">${grpLabel()}</button>
    <div class="sp"></div>
    <button class="icon-btn" data-act="themeToggle" aria-label="화면 테마">${isDark() ? ic.sun : ic.moon}</button>
    <button class="icon-btn" id="bell" data-act="go" data-tab="team" aria-label="초대">${ic.bell}${S.invites.length ? `<i>${S.invites.length}</i>` : ''}</button>
  </header>
  <main id="main"></main>
  <nav class="tabs"><div class="tabs-in">${TABS.map(t => `<button data-act="go" data-tab="${t.id}" class="${S.tab===t.id?'on':''}">${t.icon}${t.label}</button>`).join('')}</div></nav>`;
  renderTab();
}
A.go = el => {
  const t = el.dataset.tab;
  if (t === S.tab) { if (t === 'songs') { S.slView = null; S.slEdit = null; } }
  S.tab = t; localStorage.setItem('wt-tab', t);
  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  renderTab(); window.scrollTo(0, 0);
};
function renderTab() {
  stopLive(); S.seq++;
  const needGroup = ['songs','search','sched'].includes(S.tab);
  if (needGroup && !S.gid) return noGroup();
  ({ devo: tabDevo, songs: tabSongs, search: tabSearch, sched: tabSched, team: tabTeam })[S.tab]?.();
}
function noGroup() {

}

const PENDK = () => 'wt-devo-pending-' + uid();
const SWK = () => 'wt-sw-' + uid();
const getPend = () => { try { return JSON.parse(localStorage.getItem(PENDK())) || {}; } catch { return {}; } };
const setPend = p => localStorage.setItem(PENDK(), JSON.stringify(p));
const swGet = () => { try { return JSON.parse(localStorage.getItem(SWK())); } catch { return null; } };
const swSet = v => localStorage.setItem(SWK(), JSON.stringify(v));
const swVal = sw => sw ? sw.base + (sw.since ? (Date.now() - sw.since) / 1000 : 0) : 0;
const devoRow = day => S.devo[day] || { bible_chapters: 0, qt: false, prayer_seconds: 0 };

function devoPatch(day, patch) {
  S.devo[day] = { ...devoRow(day), ...patch };
  const p = getPend(); p[day] = { ...(p[day] || {}), ...patch }; setPend(p);
  devoFlushSoon();
}
const devoFlushSoon = debounce(() => flushDevo(), 700);
let flushing = false, retryMs = 2000;
async function flushDevo() {
  if (flushing || !uid()) return; const p = getPend(); const days = Object.keys(p); if (!days.length) return;
  flushing = true;
  try {
    const rows = days.map(day => ({ user_id: uid(), day, ...p[day] }));
    // 같은 열 구성끼리 묶어 보내기 (보낸 칸만 덮어씀)
    const groups = {};
    rows.forEach(r => { const k = Object.keys(r).sort().join(','); (groups[k] = groups[k] || []).push(r); });
    for (const k in groups) await q(sb.from('devotions').upsert(groups[k], { onConflict: 'user_id,day' }));
    const now = getPend(); days.forEach(d => { if (JSON.stringify(now[d]) === JSON.stringify(p[d])) delete now[d]; }); setPend(now);
    retryMs = 2000;
    if (Object.keys(now).length) devoFlushSoon();
  } catch (e) {
    console.warn('경건 저장 재시도', e); setTimeout(flushDevo, retryMs); retryMs = Math.min(retryMs * 2, 30000);
  } finally { flushing = false; }
}

function ytEmbed(u) {
  try {
    const x = new URL(u); if (!/^https?:$/.test(x.protocol)) return null;
    const list = x.searchParams.get('list'); let v = x.searchParams.get('v');
    if (/youtu\.be$/.test(x.hostname)) v = x.pathname.slice(1);
    if (!/(^|\.)youtube\.com$|(^|\.)youtu\.be$/.test(x.hostname)) return null;
    if (list) return `https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(list)}`;
    if (v) return `https://www.youtube.com/embed/${encodeURIComponent(v)}`;
  } catch {}
  return null;
}
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };

function monthSundays(ym) {
  const [y, m] = ym.split('-').map(Number); const out = []; const d = new Date(y, m - 1, 1);
  while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
  while (d.getMonth() === m - 1) { out.push(ymd(d)); d.setDate(d.getDate() + 7); }
  return out;
}
async function loadSched() {
  const sundays = monthSundays(S.schMonth);
  const since = new Date(Date.now() - 3 * 3600e3).toISOString();
  const [svc, av, asg, pr] = await Promise.all([
    q(sb.from('services').select('sunday,confirmed').eq('group_id', S.gid).in('sunday', sundays)),
    canManage()
      ? q(sb.from('availability').select('sunday,user_id,available').eq('group_id', S.gid).in('sunday', sundays))
      : q(sb.from('availability').select('sunday,user_id,available').eq('group_id', S.gid).eq('user_id', uid()).in('sunday', sundays)),
    q(sb.from('assignments').select('sunday,user_id,position').eq('group_id', S.gid).in('sunday', sundays)),
    q(sb.from('practices').select('*').eq('group_id', S.gid).gte('starts_at', since).order('starts_at').limit(10))
  ]);
  const D = { sundays, svc: {}, av: {}, asg: {}, practices: pr };
  svc.forEach(r => D.svc[r.sunday] = r);
  av.forEach(r => (D.av[r.sunday] = D.av[r.sunday] || {})[r.user_id] = r.available);
  asg.forEach(r => (D.asg[r.sunday] = D.asg[r.sunday] || []).push(r));
  S.sch = D;
}
async function tabSched() {
  const seq = S.seq;
  S.schMonth = S.schMonth || (() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; })();
  if (!S.sch) $('#main').innerHTML = skel(3);
  try { await loadSched(); } catch (e) { fail(e); if (!S.sch) return; }
  if (seq !== S.seq) return;
  renderSched();
  const reload = debounce(async () => {
    if (S.tab !== 'sched' || seq !== S.seq) return;
    try { await loadSched(); renderSched(); if (S.asg) renderSundaySheet(S.asg.day, true); } catch {}
  }, 800);
  const ch = sb.channel('sch-' + S.gid);
  ['services', 'availability', 'assignments', 'practices'].forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t, filter: `group_id=eq.${S.gid}` }, reload));
  ch.subscribe(); S.chans.push(ch);
}

  <div class="card"><div class="mem" style="border:0;padding-top:0"><span class="av">${esc(initial(S.me.display_name))}</span><div class="grow"><div class="nm">${esc(S.me.display_name)}</div><div class="tiny faint">@${esc(S.me.username)}</div></div><button class="btn sm line" data-act="myName">이름 변경</button></div>
    <div class="row"><button class="btn line grow" data-act="myPw">비밀번호 변경</button><button class="btn line grow" data-act="logout">로그아웃</button></div></div>
  <div class="sec-t">화면 테마</div>
  ${(t => `<div class="seg">${[['auto','기기 설정 따름'],['light','라이트'],['dark','다크']].map(([k, l]) => `<button class="${t===k?'on':''}" data-act="themeSet" data-t="${k}">${l}</button>`).join('')}</div>`)(localStorage.getItem('wt-theme') || 'auto')}
  <p class="tiny faint" style="text-align:center">찬양팀 ${VERSION} · 홈 화면에 추가하면 앱처럼 쓸 수 있습니다</p>`;
}
A.invRes = el => busy(el, async () => {
  const a = el.dataset.a === '1';
  await q(sb.rpc('respond_invite', { p_group: el.dataset.id, p_accept: a }));
  if (a) { localStorage.setItem('wt-gid-' + uid(), el.dataset.id); }
  await loadGroups(); renderShell(); toast(a ? '그룹에 들어왔습니다' : '초대를 거절했습니다');
});
A.invite = el => busy(el, async () => {
  const u = $('#iv-u').value.trim().replace(/^@/, ''); if (!u) throw new Error('아이디를 적어 주세요');
  const name = await q(sb.rpc('invite_member', { p_group: S.gid, p_username: u, p_positions: pickerVal('iv') }));
  toast(`${name}님에게 초대를 보냈습니다`); await loadMembers(); renderTab();
});
A.memEdit = el => {
  const m = S.memberMap[el.dataset.u]; const g = curGroup();
  openSheet(`<h3>${esc(m.name)} <span class="tiny faint">@${esc(m.username)}</span></h3>
    <div class="field"><label>포지션</label>${posPicker('me', m.positions)}</div>
    <button class="btn block" data-act="memSave" data-u="${m.user_id}">포지션 저장</button>
    ${g.owner_id !== m.user_id && m.user_id !== uid() ? `<button class="btn danger block" style="margin-top:8px" data-act="memRemove" data-u="${m.user_id}">${m.status === 'invited' ? '초대 취소' : '그룹에서 내보내기'}</button>` : ''}`);
};
A.memSave = el => busy(el, async () => {
  await q(sb.rpc('set_member_positions', { p_group: S.gid, p_user: el.dataset.u, p_positions: pickerVal('me') }));
  closeSheet(); await loadMembers(); renderTab(); toast('포지션을 바꿨습니다');
});
A.memRemove = el => busy(el, async () => {
  if (!confirm('정말 내보낼까요?')) return;
  await q(sb.rpc('remove_member', { p_group: S.gid, p_user: el.dataset.u })); closeSheet(); await loadMembers(); renderTab();
});
A.leave = el => busy(el, async () => {
  if (!confirm(`${curGroup().name} 그룹에서 나갈까요?`)) return;
  await q(sb.rpc('remove_member', { p_group: S.gid, p_user: uid() }));
  localStorage.removeItem('wt-gid-' + uid()); await loadGroups(); renderShell(); toast('그룹에서 나왔습니다');
});
A.groupSettings = () => {
  const g = curGroup();
  openSheet(`<h3>그룹 설정</h3>
    <div class="field"><label>그룹 이름</label><input id="gs-n" maxlength="40" value="${esc(g.name)}"></div>
    <button class="btn block" data-act="groupRename">이름 저장</button>
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--line)"><p class="small muted">그룹을 지우면 송리스트·댓글·스케줄이 모두 사라집니다. (개인 경건 기록은 남습니다)</p>
    <div class="field"><label>확인을 위해 그룹 이름을 그대로 적어 주세요</label><input id="gs-c"></div>
    <button class="btn danger block" data-act="groupDelete">그룹 삭제</button></div>`);
};
A.groupRename = el => busy(el, async () => {
  const n = $('#gs-n').value.trim(); if (!n) throw new Error('이름을 적어 주세요');
  await q(sb.from('groups').update({ name: n }).eq('id', S.gid)); closeSheet(); await loadGroups(); renderShell();
});
A.groupDelete = el => busy(el, async () => {
  if ($('#gs-c').value.trim() !== curGroup().name) throw new Error('그룹 이름이 맞지 않습니다');
  await q(sb.from('groups').delete().eq('id', S.gid)); closeSheet(); localStorage.removeItem('wt-gid-' + uid());
  await loadGroups(); renderShell(); toast('그룹을 삭제했습니다');
});
A.myName = () => openSheet(`<h3>이름 변경</h3><div class="field"><input id="mn" maxlength="20" value="${esc(S.me.display_name)}"></div><button class="btn block" data-act="myNameSave">저장</button>`);
A.myNameSave = el => busy(el, async () => {
  const n = $('#mn').value.trim(); if (!n) throw new Error('이름을 적어 주세요');
  await q(sb.from('profiles').update({ display_name: n }).eq('id', uid())); S.me.display_name = n; closeSheet(); await loadMembers(); renderTab();
});
A.myPw = () => openSheet(`<h3>비밀번호 변경</h3><div class="field"><label>새 비밀번호</label><input id="np" type="password" autocomplete="new-password" placeholder="6자 이상"></div><div class="field"><label>새 비밀번호 확인</label><input id="np2" type="password" autocomplete="new-password"></div><button class="btn block" data-act="myPwSave">변경</button>`);
A.myPwSave = el => busy(el, async () => {
  const p = $('#np').value; if (p.length < 6) throw new Error('6자 이상으로 정해 주세요'); if (p !== $('#np2').value) throw new Error('확인이 맞지 않습니다');
  const { error } = await sb.auth.updateUser({ password: p }); if (error) throw error; closeSheet(); toast('비밀번호를 바꿨습니다');
});
A.logout = async () => {
  if (Object.keys(getPend()).length) { await flushDevo(); if (Object.keys(getPend()).length && !confirm('아직 서버에 저장되지 않은 경건 기록이 있습니다. 그래도 로그아웃할까요?')) return; }
  await sb.auth.signOut(); S.user = null; S.groups = []; S.members = []; S.devo = {}; S.sch = null; showAuth();
};

/* ================= 연결 상태 ================= */
window.addEventListener('online', () => { const o = $('#offline'); if (o) o.hidden = true; flushDevo(); if (S.user) renderTab(); });
window.addEventListener('offline', () => { const o = $('#offline'); if (o) o.hidden = false; });
let hiddenAt = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { hiddenAt = Date.now(); flushDevo(); return; }
  if (!S.user) return;
  if (S.tab === 'devo' && S.devoMode === 'me' && lastDays) renderDevoMe();
  if (Date.now() - hiddenAt > 60e3 && !S.slEdit && $('#sheet-wrap').hidden) { try { await loadGroups(); } catch {} renderShell(); }
});
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.user) { S.user = null; showAuth(); } });

(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) afterLogin(session.user); else showAuth();
})();
</script>
</body>
</html>
